name: Tinfoil Release
run-name: Release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable release tag
        required: true
        type: string
permissions: {}
concurrency:
  group: prepare-browser-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create one immutable tag and dispatch its measurement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/prepare-release.sh
